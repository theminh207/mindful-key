# CI: build macOS (XcodeGen) + regression engine.
name: macOS

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regression engine (bộ não dùng chung)
        run: |
          bash tests/core/build.sh
          ./tests/core/test_engine

      # [MINDFUL] 2026-08-01 (#6) — phép đo nhịp gõ là TRÁI TIM mô hình mới, và máy dev hiện
      # tại là Windows KHÔNG có trình biên dịch nào (g++/clang++/cl/make đều thiếu). Nghĩa là
      # CI này là nơi DUY NHẤT ca kiểm được chạy — không có bước này thì test_cadence.cpp chỉ
      # là file nằm im, không ai biết nó xanh hay đỏ. Xem spec/typing-cadence-bell/README.md §7.
      - name: Regression nhịp gõ (core/mood/TypingCadence)
        run: |
          bash tests/core/cadence_build.sh
          ./tests/core/test_cadence

      # [MINDFUL] 2026-08-01 (#6) — CƯỠNG CHẾ HĐ-1 BẰNG MÁY.
      #
      # Hiến chương §4.2 hứa "sản phẩm không đọc nội dung". Lời hứa đó chỉ thật khi người đọc
      # code nhìn thấy được rằng không có đường nào cho chữ đi vào — mà "nhìn thấy được" thì
      # phụ thuộc vào việc CÓ AI ĐỌC hay không. Bước này biến nó thành thứ không phụ thuộc
      # người: API lớp nhịp gõ/chuông mọc ra tham số kiểu chuỗi là CI đỏ ngay.
      #
      # Đây là cùng một lối nghĩ với `make brand-lint` (hiến chương §4.1 tự nói phải cưỡng chế
      # bằng máy "không phụ thuộc vào việc có ai đọc tài liệu hay không") — nay áp cho §4.2.
      #
      # Pattern giữ ĐÚNG MỘT BẢN ở đây. Đừng chép nó vào comment trong core/mood/: dòng chép
      # sẽ tự khớp và làm đỏ CI oan (đã vấp thật lúc dựng bước này).
      #
      # Cách soi: quét CHÍNH các file của lớp nhịp gõ/chuông tìm mọi kiểu chuỗi, bỏ dòng
      # comment. KHÔNG dùng kiểu "tên-lớp gần kiểu-chuỗi" — mẫu đó phụ thuộc thứ tự chữ trên
      # dòng nên `void TypingCadence_OnWord(const wstring&)` LỌT QUA (đã thử, trượt thật).
      # Nếu không thấy file nào thì cũng ĐỎ, để không ai vô hiệu cổng bằng cách đổi tên file.
      - name: Cổng HĐ-1 — lớp nhịp gõ không được nhận chuỗi
        run: |
          files=$(ls core/mood/TypingCadence.h core/mood/TypingCadence.cpp \
                     core/mood/BellPolicy.h core/mood/BellPolicy.cpp 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::error::Không tìm thấy file nào của lớp nhịp gõ/chuông — cổng HĐ-1 không soi được gì."
            exit 1
          fi
          # Mẫu CỐ Ý RỘNG — `string|String|char` phủ mọi hình dạng đã thử:
          #   wstring · std::string · u16string/u32string · NSString · CFStringRef ·
          #   char* · char[] · wchar_t* · char16_t
          # Bản trước hẹp hơn (`char[[:space:]]*\*`) và BỎ SÓT `const wchar_t*` — đúng kiểu
          # chuỗi phổ biến NHẤT trong core/mood hiện nay (MoodPhrasing.cpp, SendRiskAnalyzer.cpp
          # dùng đầy) và đúng thứ #7 BellPolicy dễ viết ra: `const wchar_t* levelName`.
          # KHÔNG dùng `\b`: đó là mở rộng của GNU grep, runner này là BSD grep.
          # Thà bắt oan còn hơn bỏ lọt — đây là cổng riêng tư, fail-closed.
          hits=$(grep -nE '(string|String|char)' $files \
                 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::HĐ-1 vi phạm — lớp nhịp gõ/chuông có kiểu chuỗi. Xem docs/04-contracts.md HĐ-1: nhận chuỗi rồi chỉ dùng .length() VẪN là vi phạm."
            exit 1
          fi
          echo "OK — HĐ-1 sạch: không kiểu chuỗi nào trong lớp nhịp gõ/chuông."

      - name: Generate Xcode project
        run: cd platforms/apple && xcodegen generate

      - name: Build app macOS (ad-hoc sign)
        run: |
          xcodebuild \
            -project "platforms/apple/MindfulKey.xcodeproj" \
            -scheme MindfulKey -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
